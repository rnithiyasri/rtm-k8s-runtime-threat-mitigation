apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-service
  namespace: shop
  labels:
    app: reviews-service
    app.kubernetes.io/part-of: rtm-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews-service
  template:
    metadata:
      labels:
        app: reviews-service
        app.kubernetes.io/part-of: rtm-shop
    spec:
      containers:
        - name: reviews-service
          image: reviews-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-service
  namespace: shop
  labels:
    app: reviews-service
    app.kubernetes.io/part-of: rtm-shop
spec:
  selector:
    app: reviews-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
