apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim
  namespace: shop
  labels:
    app: victim
    rtm.enforce: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victim
  template:
    metadata:
      labels:
        app: victim
        rtm.enforce: "true"
    spec:
      containers:
        - name: victim
          image: reviews-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: victim
  namespace: shop
  labels:
    app: victim
spec:
  selector:
    app: victim
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
