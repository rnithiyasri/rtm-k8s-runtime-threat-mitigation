apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rtm-restrict
  namespace: shop
spec:
  podSelector:
    matchLabels:
      rtm.tier: restrict
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
