apiVersion: v1
kind: Namespace
metadata:
  name: rtm-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rtm-controller
  namespace: rtm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rtm-controller-role
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rtm-controller-binding
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: rtm-controller
    namespace: rtm-system
roleRef:
  kind: Role
  name: rtm-controller-role
  apiGroup: rbac.authorization.k8s.io
